name: Build Nekogram Mono

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: "Gradle task (cek varian di TMessagesProj_App/build.gradle)"
        default: "assembleAfatRelease"
        required: true
  push:
    tags: [ "v*" ]

env:
  MAIN_MODULE: TMessagesProj_App

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (dengan submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Baca versi NDK & build-tools dari proyek
        run: |
          ndk=$(sed -n 's:^\s*ndkVersion "\([^"]*\)"\s*$:\1:p' TMessagesProj/build.gradle | head -n1)
          bt=$(sed -n "s:^\s*buildToolsVersion '\([^']*\)'\s*$:\1:p" ${MAIN_MODULE}/build.gradle | head -n1)
          echo "NDK_VERSION=$ndk" >> $GITHUB_ENV
          echo "BUILD_TOOLS=$bt" >> $GITHUB_ENV
          echo "NDK=$ndk  build-tools=$bt"

      - name: Install NDK, CMake, build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          pkgs=("cmake;3.22.1")
          [ -n "$NDK_VERSION" ] && pkgs+=("ndk;$NDK_VERSION")
          [ -n "$BUILD_TOOLS" ] && pkgs+=("build-tools;$BUILD_TOOLS")
          sdkmanager "${pkgs[@]}"

      - name: Install native build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build yasm

      - name: Inject secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXTRA_JAVA_B64: ${{ secrets.EXTRA_JAVA_B64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > TMessagesProj/google-services.json

          # Extra.java opsional: kalau secret kosong, pakai file bawaan repo
          if [ -n "$EXTRA_JAVA_B64" ]; then
            echo "$EXTRA_JAVA_B64" | base64 -d > TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java
          fi

          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :${MAIN_MODULE}:${{ github.event.inputs.gradle_task || 'assembleAfatRelease' }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-mono-${{ github.sha }}
          path: ${{ env.MAIN_MODULE }}/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Hapus rahasia dari runner
        if: always()
        run: rm -f release.keystore TMessagesProj/google-services.json
